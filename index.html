<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureScrub - Free Instant Photo Privacy Cleaner</title>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .upload-box { border: 2px dashed #007bff; padding: 40px; background: white; border-radius: 10px; display: inline-block; cursor: pointer; }
        #downloadBtn { display: none; margin-top: 20px; padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🛡️ PureScrub</h1>
    <p>Remove GPS, Camera Info, and Timestamps instantly. 100% Private.</p>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        Drag & Drop or Click to Upload Image
        <input type="file" id="fileInput" hidden accept="image/*">
    </div>

    <br>
    <button id="downloadBtn">Download Private Image</button>

    <script>
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Simple Logic: Draw image to Canvas to strip metadata
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                // Convert back to image (this strips EXIF automatically)
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    downloadBtn.onclick = () => {
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = "private_" + file.name;
                        a.click();
                    };
                    downloadBtn.style.display = "inline-block";
                    alert("Metadata Stripped! Your private image is ready.");
                }, 'image/jpeg', 0.9);
            };
        });
    </script>
</body>
</html>
